<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact White Water Rafting in Bolivia. Find our address, phone number, email, and send us a message for inquiries, reservations or suggestions.">
    <meta name="author" content="Virginia Rocha">
    <title>Contact Us &#124; White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <div class="page-container">
        <header>
            <div class="wrapper">
                <div class="header-grid">
                    <img src="images/z-wwr-blue.jpg" alt="Water Rafting logo" class="logo">

                    <nav>
                        <ul class="nav-menu">
                            <li><a href="index.html">Home</a></li>
                            <li><a href="about.html">About Us</a></li>
                            <li><a href="trips.html">Trips</a></li>
                            <li><a href="contact.html">Contact Us</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>

        <main class="wrapper">

            <h1 class="section-tittle">Contact Us</h1>

            <section class="company-info">
                <h2>White Water Rafting Company</h2>
                <p><strong>Address:</strong>456 Circunvalacion Ave, Cochabamba, BO</p>
                <p><strong>Phone:</strong>+591 44258961</p>
                <p><strong>Email:</strong>info@wwrafting.com</p>
            </section>

            <div class="contact-layout">
                <div class="map-container">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3492.221403196261!2d-66.17030415719287!3d-17.34957417386072!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sbo!4v1764337628644!5m2!1ses!2sbo"
                        width="600" height="450" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        title="Location map of White Water Rafting in Cochabamba, Bolivia">
                    </iframe>
                </div>

                <div class="form-container">
                    <div class="contact-form">

                        <form action="#" method="post" class="form-grid">

                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" required>

                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>

                            <fieldset>
                                <legend>Purpose of Your Message</legend>

                                <div class="radio-options">

                                    <div class="radio-item">
                                        <input type="radio" id="purpose-general" name="purpose" value="general"
                                            required>
                                        <label for="purpose-general">General Inquiry</label>
                                    </div>

                                    <div class="radio-item">
                                        <input type="radio" id="purpose-booking" name="purpose" value="booking">
                                        <label for="purpose-booking">Booking Question </label>
                                    </div>

                                    <div class="radio-item">
                                        <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                                        <label for="purpose-suggestion">Website Suggestion</label>
                                    </div>
                                </div>
                            </fieldset>

                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>

                            <label class="checkbox">
                                <input type="checkbox" id="subscribe" name="subscribe">
                                Please subscribe me to the monthly newsletter
                            </label>

                            <button type="submit" class="submit-btn">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>

            <section class="staff">
                <h2>Our Team</h2>

                <div class="staff-grid">
                    <figure class="employee">
                        <img src="images/john.jpg" alt="River Guide John">
                        <figcaption>
                            <h3>John Carrasco</h3>
                            <p>Senior River Guide</p>
                        </figcaption>
                    </figure>

                    <figure class="employee">
                        <img src="images/jose.jpg" alt="Safety Instructor Jose">
                        <figcaption>
                            <h3>Jose Lopez</h3>
                            <p>Safety Instructor</p>
                        </figcaption>
                    </figure>

                    <figure class="employee">
                        <img src="images/maria.jpg" alt="Customer Service Maria">
                        <figcaption>
                            <h3>Maria Gutierrez</h3>
                            <p>Customer Service Specialist</p>
                        </figcaption>
                    </figure>

                </div>
            </section>

        </main>

        <footer>
            <div class="wrapper">
                <p>&copy; 2025 White Water Rafting &#124; Created by: Virginia Rocha</p>

                <nav class="socialmedia">
                    <a href="https://www.facebook.com/" target="_blank">
                        <img src="images/facebook_logo.jpg" alt="Follow us on Facebook"></a>
                    <a href="https://x.com/" target="_blank">
                        <img src="images/x_twitter_logo.jpg" alt="Visit our Twitter profile"></a>
                    <a href="https://www.instagram.com/" target="_blank">
                        <img src="images/instagram_logo.jpg" alt="See our Instagram gallery"></a>
                </nav>
            </div>
        </footer>
    </div>

</body>

</html>
